<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>ยืนยันการอ่าน · MangaDock</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #090910; color: #f4f4fc; }
    main { width: min(360px, calc(100% - 64px)); padding: 24px; background: #15151f; border: 1px solid #282838; border-radius: 20px; }
    .brand { color: #a78bfa; font-weight: 900; letter-spacing: 1px; }
    h1 { font-size: 24px; } p { color: #aaaabd; line-height: 1.65; }
    #challenge { min-height: 70px; margin: 24px 0; }
    a { display: block; padding: 14px; margin-top: 20px; text-align: center; background: #a78bfa; color: #171126; border-radius: 12px; font-weight: 700; text-decoration: none; }
    a[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand">MANGADOCK</div>
    <h1>ยืนยันก่อนเริ่มอ่าน</h1>
    <p>ตรวจสอบให้เสร็จ แล้วกลับไปอ่านต่อในแอป</p>
    <div id="challenge"></div>
    <p id="status" role="status">กำลังเปิดการตรวจสอบ…</p>
    <a id="return" hidden>กลับไป MangaDock</a>
  </main>
  <script src="./config.js"></script>
  <script id="turnstile-script" src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script type="module">
    import { buildCaptchaCallback } from './protocol.mjs';
    const status = document.getElementById('status');
    const back = document.getElementById('return');
    let rendered = false;
    function reset(message) { back.hidden = true; back.removeAttribute('href'); status.textContent = message; }
    function render() {
      if (rendered) return;
      try {
        buildCaptchaCallback(location.href, 'check-request');
        if (!window.MANGADOCK_CAPTCHA_SITE_KEY) throw new Error('ยังไม่สามารถเปิดการตรวจสอบได้ กรุณากลับไปลองใหม่ภายหลัง');
        rendered = true;
        window.turnstile.render('#challenge', {
          sitekey: window.MANGADOCK_CAPTCHA_SITE_KEY,
          theme: 'dark',
          callback(token) { back.href = buildCaptchaCallback(location.href, token); back.hidden = false; status.textContent = 'ตรวจสอบเสร็จแล้ว กดกลับไปอ่านต่อ'; },
          'expired-callback'() { reset('การตรวจสอบหมดอายุ กรุณาตรวจสอบใหม่'); },
          'error-callback'() { reset('ตรวจสอบไม่สำเร็จ กรุณาลองอีกครั้ง'); },
        });
      } catch (error) { reset(error.message); }
    }
    if (window.turnstile) render();
    else document.getElementById('turnstile-script').addEventListener('load', render);
    document.getElementById('turnstile-script').addEventListener('error', () => reset('ไม่สามารถเชื่อมต่อการตรวจสอบได้ กรุณาลองอีกครั้ง'));
  </script>
</body>
</html>
