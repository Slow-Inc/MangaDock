apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Keep private signing material outside the repository.
def signingValue = { name -> providers.gradleProperty(name).orElse(providers.environmentVariable(name)).getOrNull() }
def releaseStoreFile = signingValue('MANGADOCK_UPLOAD_STORE_FILE')
def releaseStorePassword = signingValue('MANGADOCK_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = signingValue('MANGADOCK_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = signingValue('MANGADOCK_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
def qaSigning = providers.gradleProperty('mangadockQaSigning').getOrElse('false') == 'true'

// Public Supabase client configuration, supplied outside source control.
def nativeAuthProperties = new Properties()
def nativeAuthPropertiesPath = providers.gradleProperty('mangadockNativeAuthProperties').getOrNull()
if (nativeAuthPropertiesPath) {
    file(nativeAuthPropertiesPath).withInputStream { nativeAuthProperties.load(it) }
}
def nativeAuthValue = { name -> signingValue(name) ?: nativeAuthProperties.getProperty(name, '') }

// Fail before building a distribution artifact with missing signing credentials.
gradle.taskGraph.whenReady { graph ->
    def requestsRelease = graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }
    if (requestsRelease && !qaSigning && !hasReleaseSigning) {
        throw new GradleException('Release signing requires all four MANGADOCK_UPLOAD_* values. For local QA only, use -PmangadockQaSigning=true.')
    }
    if (requestsRelease && !qaSigning && !file(releaseStoreFile).isFile()) {
        throw new GradleException('MANGADOCK_UPLOAD_STORE_FILE does not point to a keystore file.')
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mobile"
    // A short, checkout-specific staging directory keeps Ninja paths usable on Windows.
    if (System.getProperty("os.name").toLowerCase().contains("windows")) {
        externalNativeBuild {
            cmake {
                buildStagingDirectory file("${System.getProperty('java.io.tmpdir')}/mangadock-cxx/${Integer.toHexString(rootDir.absolutePath.hashCode())}")
            }
        }
    }
    defaultConfig {
        applicationId "com.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.1-beta.3"
        buildConfigField "String", "MANGADOCK_GOOGLE_WEB_CLIENT_ID", groovy.json.JsonOutput.toJson(nativeAuthValue('MANGADOCK_GOOGLE_WEB_CLIENT_ID'))
        buildConfigField "String", "MANGADOCK_FACEBOOK_APP_ID", groovy.json.JsonOutput.toJson(nativeAuthValue('MANGADOCK_FACEBOOK_APP_ID'))
        buildConfigField "String", "MANGADOCK_FACEBOOK_CLIENT_TOKEN", groovy.json.JsonOutput.toJson(nativeAuthValue('MANGADOCK_FACEBOOK_CLIENT_TOKEN'))
        resValue "string", "facebook_app_id", nativeAuthValue('MANGADOCK_FACEBOOK_APP_ID') ?: '0'
        resValue "string", "facebook_client_token", nativeAuthValue('MANGADOCK_FACEBOOK_CLIENT_TOKEN') ?: 'unset'
        resValue "string", "fb_login_protocol_scheme", 'fb' + (nativeAuthValue('MANGADOCK_FACEBOOK_APP_ID') ?: '0')
        buildConfigField "String", "MANGADOCK_SUPABASE_URL", groovy.json.JsonOutput.toJson(nativeAuthValue('MANGADOCK_SUPABASE_URL'))
        buildConfigField "String", "MANGADOCK_SUPABASE_PUBLIC_KEY", groovy.json.JsonOutput.toJson(nativeAuthValue('MANGADOCK_SUPABASE_PUBLIC_KEY'))
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_OBJECT_PATH_MAX=240"
            }
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (qaSigning) {
                signingConfig signingConfigs.debug
            } else if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.google.android.gms:play-services-base:18.5.0")
    implementation("androidx.credentials:credentials:1.6.0")
    implementation("androidx.credentials:credentials-play-services-auth:1.6.0")
    // 1.2.x requires Kotlin 2.4 metadata; the RN build uses Kotlin 2.1.
    implementation("com.google.android.libraries.identity.googleid:googleid:1.1.1")
    implementation("com.facebook.android:facebook-login:18.3.0")
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
